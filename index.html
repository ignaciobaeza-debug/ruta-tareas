<title>Ruta de tareas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Diseño: cinco columnas (Recibido, En proceso, En revisión, En producción, Terminado); En producción es opcional. En proceso, En revisión y Terminado llevan su variante como etiqueta en la tarjeta. Verde = con Marketing, ámbar = esperando a terceros. Cada cambio queda con fecha para medir días por etapa. */
:root{
  --bg:#eef1f5;--panel:#ffffff;--col:#e2e7ee;--ink:#14202b;--ink2:#33414f;--muted:#5d6b79;--line:#d3dae3;
  --mkt:#0e8f74;--mkt-bg:#dcf3ec;--ext:#d08a1a;--ext-text:#8f5b00;--ext-bg:#fcefd6;--done:#2f7d3a;--done-bg:#dff1e1;--gray-bg:#e6e9ee;
  --late:#b42318;--now:#1f5fbf;--btn:#1f5fbf;--btn-h:#184c99;--hover:#f4f6f9;--top:#14202b;--ph:#b9c7d6;
  --font:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1620;--panel:#1a2531;--col:#131d28;--ink:#e6edf3;--ink2:#c3cfda;--muted:#97a6b5;--line:#2c3a49;
  --mkt:#2fc4a2;--mkt-bg:#12362f;--ext:#f0b23f;--ext-text:#f3c060;--ext-bg:#3a2c12;--done:#5bbf6a;--done-bg:#173a20;--gray-bg:#26323f;
  --late:#f28b82;--now:#6ba5f2;--btn:#2f6fd0;--btn-h:#3a7de0;--hover:#223040;--top:#0a1119;--ph:#3d5166;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1620;--panel:#1a2531;--col:#131d28;--ink:#e6edf3;--ink2:#c3cfda;--muted:#97a6b5;--line:#2c3a49;
  --mkt:#2fc4a2;--mkt-bg:#12362f;--ext:#f0b23f;--ext-text:#f3c060;--ext-bg:#3a2c12;--done:#5bbf6a;--done-bg:#173a20;--gray-bg:#26323f;
  --late:#f28b82;--now:#6ba5f2;--btn:#2f6fd0;--btn-h:#3a7de0;--hover:#223040;--top:#0a1119;--ph:#3d5166;color-scheme:dark}
*{box-sizing:border-box}
html{font-family:var(--font);font-size:15px;color:var(--ink);background:var(--bg)}
body{margin:0;line-height:1.4;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--now);outline-offset:2px}
[hidden]{display:none!important}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* barra superior */
header.top{background:var(--top);color:#fff;display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-height:54px}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px}
nav.tabs{display:flex;gap:2px}
nav.tabs button{background:none;border:0;color:#aebccb;padding:17px 12px 14px;cursor:pointer;font-weight:600;border-bottom:3px solid transparent}
nav.tabs button.on{color:#fff;border-color:#fff}
.sp{flex:1}
.who{display:flex;gap:8px;align-items:center;color:#aebccb;font-size:13px}
.top select{background:#22313f;border:1px solid #33465a;color:#fff;border-radius:8px;padding:5px 8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:#fff}
.btn.pri:hover{background:var(--btn-h)}
.btn.ghost{background:none;border-color:#33465a;color:#e3eaf1}
.btn.ghost:hover{background:#22313f}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--late)}
.note{background:#fff4d6;color:#6b4a00;font-size:14px;padding-block:8px;border-bottom:1px solid #ecd48a}
/* filtros */
.tools{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;padding-block:12px}
.fgroup{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.fgroup .lab{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.fchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.fchip:hover{background:var(--hover)}
.fchip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.fchip .av{width:18px;height:18px;font-size:10px;box-shadow:none}
.fchip.sm{padding:2px 9px;font-size:12px}
.tools input[type=search]{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);width:200px;max-width:100%}
.vsep{width:1px;height:22px;background:var(--line)}
/* tablero */
.board{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-block:2px 18px;scroll-snap-type:x proximity}
.col{flex:1 1 0;min-width:240px;background:var(--col);border-radius:12px;padding:10px 8px 8px;display:flex;flex-direction:column;max-height:calc(100vh - 190px);scroll-snap-align:start}
.col.over{outline:2px dashed var(--ph);outline-offset:-2px}
.colh{display:flex;align-items:center;gap:8px;padding:0 4px 8px;flex-wrap:wrap}
.colh h2{font-size:15px;margin:0;font-weight:700}
.colh .cnt{font-size:13px;color:var(--muted);font-weight:600}
.colf{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:0 4px 8px}
.colf input{border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--panel);font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.m{background:var(--mkt)}.dot.e{background:var(--ext)}.dot.d{background:var(--done)}.dot.r{background:var(--muted)}.dot.x{background:var(--ph)}
.cards{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:60px;padding:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px 8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 1px rgba(20,32,43,.06)}
.card:hover{border-color:var(--ph)}
.card.dragging{opacity:.4}
.card.cancel{opacity:.62}
.card.cancel h3{text-decoration:line-through}
.card h3{font-size:14px;font-weight:600;margin:0;line-height:1.3;overflow-wrap:anywhere}
.card h3 .num{color:var(--muted);font-weight:600;margin-right:4px}
.lbls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.emp{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 45%,var(--panel));color:var(--ink);white-space:nowrap}
.tipo{font-size:12px;color:var(--muted)}
.etq{all:unset;box-sizing:border-box;display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;padding:2px 9px;border-radius:6px;cursor:pointer;max-width:100%;overflow-wrap:anywhere}
.etq.m{background:var(--mkt-bg);color:var(--mkt)}
.etq.e{background:var(--ext-bg);color:var(--ext-text)}
.etq.d{background:var(--done-bg);color:var(--done)}
.etq.x{background:var(--gray-bg);color:var(--muted)}
.etq:hover{filter:brightness(.96)}
.etq:focus-visible{outline:2px solid var(--now);outline-offset:2px}
.etq[disabled]{cursor:default}
.etq b{font-weight:700}
.etq .w{font-weight:500}
.manos{font-size:13px;color:var(--ink2);margin-top:-2px}
.manos b{font-weight:600}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.meta .m{display:inline-flex;gap:3px;align-items:center;white-space:nowrap}
.m.lnk{color:var(--mkt);text-decoration:none;border-radius:4px}.m.lnk:hover{text-decoration:underline}.m.lnk:focus-visible{outline:2px solid var(--now);outline-offset:2px}
.lnkrow{display:flex;gap:6px;align-items:center}.lnkrow input{flex:1;min-width:0}
.m.late{color:var(--late)}.m.stale{color:var(--ext-text)}.m.ok{color:var(--done)}
.avs{display:flex}
.av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-weight:700;font-size:11px;flex:none;box-shadow:0 0 0 2px var(--panel)}
.avs .av+.av{margin-left:-5px}
.av.xs{width:17px;height:17px;font-size:9px;box-shadow:0 0 0 1.5px var(--panel)}
.pend{display:inline-flex;align-items:center;gap:2px}
.opt.dis{opacity:.55;cursor:not-allowed}
.opt.dis:hover{background:none}
.opt .why{display:block;font-size:12px;font-weight:500;color:var(--late);margin-top:2px}
.opt .lbl{display:flex;flex-direction:column}
.empty-col{font-size:13px;color:var(--muted);padding:8px 6px}
.add{all:unset;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;padding:8px 6px 2px}
.add:hover{color:var(--ink)}
.add:focus-visible{outline:2px solid var(--now)}
/* lista y resumen */
.wrap{max-width:1240px}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table.t th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--hover)}
table.t .n{text-align:right}
.sorth{all:unset;cursor:pointer}
.sorth.on{color:var(--ink)}
.stage{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;white-space:nowrap}
.muted{color:var(--muted)}
.cards4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .num{font-size:32px;font-weight:700;line-height:1.1}
.kpi .lbl{font-weight:600}
.kpi .hint{font-size:13px;color:var(--muted)}
.sec{margin-bottom:26px}
.sec h2{font-size:16px;margin:0 0 4px}
.sec p.intro{margin:0 0 10px;color:var(--muted);font-size:14px;max-width:70ch}
.rhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.rhead input,.pick input{border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--panel);font-size:13px}
.pick{margin-bottom:16px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:0 24px}
/* diálogos */
dialog{border:0;padding:0;background:var(--panel);color:var(--ink);box-shadow:0 24px 70px rgba(10,20,30,.35)}
dialog::backdrop{background:rgba(10,20,30,.45)}
dialog.side{margin:0 0 0 auto;height:100%;max-height:100%;width:min(580px,100vw);border-radius:0}
dialog.mid{border-radius:12px;width:min(520px,94vw)}
.tp{padding:18px max(20px,env(safe-area-inset-right,0px)) 28px 22px;display:flex;flex-direction:column;gap:18px}
.tp-h{display:flex;align-items:center;gap:10px}
.tp-h .num{font-size:13px;font-weight:700;color:var(--muted)}
.x{all:unset;cursor:pointer;margin-left:auto;font-size:22px;line-height:1;color:var(--muted);padding:2px 6px;border-radius:6px}
.x:hover{background:var(--hover);color:var(--ink)}
.x:focus-visible{outline:2px solid var(--now)}
.ttl-in{font-size:21px;font-weight:700;border:1px solid transparent;border-radius:8px;padding:4px 6px;margin:-4px -6px;width:calc(100% + 12px);resize:none;background:none;line-height:1.25}
.ttl-in:hover,.ttl-in:focus{border-color:var(--line);background:var(--panel)}
.box{background:var(--bg);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ask{background:var(--ext-bg);color:var(--ink);border-radius:10px;padding:12px 14px;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;font-weight:600}
.mv{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mv select,.mv input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel);min-width:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f>label,.lb{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.f input:disabled{opacity:.55}
.f textarea{min-height:76px;resize:vertical}
.f .ro{padding:8px 0;font-weight:600}
.f .hint{font-size:12px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.opt:hover{background:var(--hover)}
.opt:has(input:checked){border-color:var(--btn);box-shadow:inset 0 0 0 1px var(--btn)}
.opt input{accent-color:var(--btn);width:16px;height:16px;margin:0}
.opt .who2{margin-left:auto;font-size:12px;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;width:1px;height:1px}
.pill span{display:inline-flex;gap:6px;align-items:center;padding:4px 11px 4px 5px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;background:var(--panel)}
.pill span:hover{background:var(--hover)}
.pill input:checked+span{background:var(--btn);border-color:var(--btn);color:#fff}
.pill input:focus-visible+span{outline:2px solid var(--now);outline-offset:2px}
.pill input:disabled+span{cursor:default}
.pill .av{width:20px;height:20px;font-size:10px;box-shadow:none}
.subs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sub{display:grid;grid-template-columns:22px minmax(0,1fr) 112px 62px 26px;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line)}
.sub:first-child{border-top:0}
.sub input[type=text]{border:1px solid transparent;border-radius:6px;padding:4px 6px;background:none;min-width:0;width:100%}
.sub input[type=text]:hover,.sub input[type=text]:focus{border-color:var(--line)}
.sub.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.sub select{border:1px solid var(--line);border-radius:6px;padding:3px 4px;background:var(--panel);font-size:13px;min-width:0}
.sub .d{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.sub input[type=checkbox]{width:17px;height:17px;accent-color:var(--done)}
.subadd{display:grid;grid-template-columns:minmax(0,1fr) 112px auto;gap:8px;padding:8px 10px;background:var(--bg)}
.hadd{display:grid;grid-template-columns:76px 112px 140px minmax(0,1fr) auto;gap:8px;padding:8px 10px;background:var(--bg)}
.hadd input,.hadd select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--panel);min-width:0}
.hrow{display:grid;grid-template-columns:52px 70px 112px minmax(0,1fr) 26px;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line);font-size:14px}
.hrow:first-child{border-top:0}
.subadd input,.subadd select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--panel);min-width:0}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--done)}
table.h{width:100%;border-collapse:collapse;font-size:13px}
table.h th{text-align:left;color:var(--muted);font-weight:600;padding:4px 8px 4px 0}
table.h td{padding:5px 8px 5px 0;border-top:1px solid var(--line)}
table.h .n{text-align:right}
.danger-zone{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line)}
.dlg{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.dlg h3{margin:0;font-size:18px}
.dlg .sub-h{margin:-8px 0 0;color:var(--muted);font-size:14px}
.dact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#14202b;color:#fff;border:1px solid #33465a;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
.toast.show{opacity:1}
.loading{padding:40px 0;color:var(--muted)}
.login{max-width:380px;margin:48px auto;display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
.login h2{margin:0;font-size:20px}
.login .err{margin:0;color:var(--late);font-size:14px}
.rlist{display:flex;flex-direction:column;gap:6px}
.rlist .row{display:flex;gap:8px;align-items:center}
.rlist .row span{flex:1}
@media(max-width:700px){.col{flex:0 0 86vw;min-width:0;max-height:none}.grid{grid-template-columns:1fr}.sub{grid-template-columns:22px minmax(0,1fr) 96px 26px}.sub .d{display:none}.subadd{grid-template-columns:1fr 1fr}.subadd .btn{grid-column:1/-1}.hadd{grid-template-columns:1fr 1fr}.hadd .btn,.hadd #hrsN{grid-column:1/-1}.cols2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top gut">
  <div class="brand"><svg width="24" height="24" viewBox="0 0 26 26" fill="none" aria-hidden="true"><path d="M3 20c5 0 4-14 10-14s5 14 10 14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="3" cy="20" r="2.6" fill="#0e8f74"/><circle cx="13" cy="6" r="2.6" fill="#e0971f"/><circle cx="23" cy="20" r="2.6" fill="#fff"/></svg>Ruta de tareas</div>
  <nav class="tabs" id="tabs"><button data-view="tablero">Tablero</button><button data-view="lista">Lista</button><button data-view="resumen">Resumen</button></nav>
  <div class="sp"></div>
  <label class="who" for="me">Yo soy <select id="me"></select></label>
  <button class="btn ghost sm" id="cfgBtn" data-act="cfg">Ajustes</button>
  <button class="btn pri sm" id="newBtn" data-act="new" data-col="recibido">+ Nueva tarea</button>
  <button class="btn ghost sm" id="outBtn" data-act="logout" hidden>Salir</button>
</header>
<div id="note"></div>
<div class="tools gut" id="tools"></div>
<main class="gut" id="content"><div class="loading">Cargando el tablero…</div></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script>
'use strict';
/* ================= Configuración ================= */
const LKEY='ruta-tablero-v1';
const COLS=[
  {id:'recibido',name:'Recibido',dot:'r'},
  {id:'proceso',name:'En proceso',dot:'m'},
  {id:'revision',name:'En revisión',dot:'e'},
  {id:'produccion',name:'En producción',dot:'e'},
  {id:'terminado',name:'Terminado',dot:'d',done:true},
];
// Variantes dentro de una columna. ext = la tarea espera a alguien fuera de Marketing.
const ETAPAS=[
  {id:'mkt',name:'Trabajo Marketing',ext:false},
  {id:'cotizacion',name:'En cotización',ext:true},
];
const REVISIONES=[
  {id:'presupuesto',name:'Autorización de presupuesto',ext:true},
  // Después de aprobado el presupuesto, Finanzas transfiere al proveedor antes de producir
  {id:'pago',name:'Pago a proveedor (Finanzas)',ext:true,manos:'Finanzas'},
  {id:'vb',name:'Visto bueno',ext:true},
];
const FINALES=[
  {id:'entregado',name:'Entregado'},
  {id:'publicado',name:'Publicado'},
  {id:'recepcionado',name:'Material recepcionado'},
  {id:'cancelado',name:'Cancelado / descartado',cancel:true},
];
const colOf=id=>COLS.find(c=>c.id===id)||COLS[0];
const etapaOf=id=>ETAPAS.find(e=>e.id===id)||ETAPAS[0];
const revOf=id=>REVISIONES.find(e=>e.id===id)||REVISIONES.find(e=>e.id==='vb');
const finalOf=id=>FINALES.find(e=>e.id===id)||FINALES[0];
// Variantes de cada columna que las tiene (las demás no llevan variante)
const VARIANTES={proceso:ETAPAS,revision:REVISIONES,terminado:FINALES};
const defEtapa=col=>({proceso:'mkt',revision:'vb',terminado:'entregado'})[col]||'';
// Etapas para medir tiempos: cada estadía de una tarea cae en una de estas

function normStep(o){

  if(c==='aprobacion'||c==='presupuesto'||(c==='proceso'&&e==='aprobacion'))return {...o,col:'revision',etapa:'presupuesto'};
  if(c==='produccion'||(c==='proceso'&&e==='produccion'))return {...o,col:'produccion',etapa:''};

}

function info(t){
  const ms=(t.moves||[]).map((m,i)=>({...m,i})).sort((a,b)=>mKey(a).localeCompare(mKey(b))||a.i-b.i);
  const today=todayISO(),now=Date.now();
  const stays=ms.map((m,i)=>{const nx=ms[i+1],end=nx?nx.date:'',k=stageKey(m),st=stageOf(k);
    return {key:k,col:m.col,etapa:m.etapa,manos:m.manos||'',motivo:m.motivo||'',start:m.date,startTime:m.time||'',end,endTime:nx?nx.time||'':'',by:m.by,byName:m.byName||'',
      days:st.done?0:Math.max(0,dd(m.date,end||today)),t0:tsOf(m.date,m.time),t1:nx?tsOf(nx.date,nx.time):now,hrs:st.done?0:Math.max(0,((nx?tsOf(nx.date,nx.time):now)-tsOf(m.date,m.time))/36e5),ext:!!st.ext,done:!!st.done}});
  const cur=stays[stays.length-1];
  const start=ms[0]?ms[0].date:(t.created||today),startTime=ms[0]?ms[0].time||'':'';
  const isDone=t.col==='terminado';
  const cancelled=isDone&&t.etapa==='cancelado';
  const end=isDone&&cur?cur.start:'';
  let dm=0,de=0,hm=0,he=0;stays.forEach(s=>{if(s.done)return;if(s.ext){de+=s.days;he+=s.hrs}else{dm+=s.days;hm+=s.hrs}});
  const revs=stays.filter(s=>s.col==='revision').length;
  return {stays,cur,start,startTime,end,endTime:isDone&&cur?cur.startTime:'',hm,he,totalH:hm+he,isDone,cancelled,days:cur&&!isDone?cur.days:0,total:Math.max(0,dd(start,end||today)),dm,de,revs,ext:!!(cur&&cur.ext)};
}

// Base compartida en claude.ai; si no está disponible, copia local en este navegador.
const queues={};
function enqueue(key,fn){const p=(queues[key]||Promise.resolve()).then(fn).catch(failWrite);queues[key]=p;return p}
function failWrite(e){const c=e&&e.code;
  if(c==='42501'){toast('La base no aceptó el cambio: solo los responsables de la tarea o el administrador pueden modificarla.');sbReload();return}
  if(c==='invalid_argument'){RO=true;renderAll();toast('No tienes permiso para editar este tablero. Pide acceso como colaborador.')}
  else if(c==='quota_exceeded')toast('La base de datos está llena. Elimina tareas antiguas para seguir creando.');
  else toast('No se pudo guardar el último cambio. Revisa tu conexión e inténtalo de nuevo.')}
function persist(id){

  if(DB)return enqueue(id,()=>{const cur=TASKS.get(id);if(!cur)return;const {id:_x,...body}=cur;return DB.doc('tasks/'+id).set(body)});
  saveLocal();
}

/* ================= Reglas del equipo ================= */
// Con más de un responsable, cada uno tiene al menos una subtarea a su nombre.
function ensureSubs(t){
  if((t.resp||[]).length<2)return [];
  const added=[];
  t.resp.forEach(p=>{if(!(t.subs||[]).some(s=>s.resp===p)){t.subs=[...(t.subs||[]),{t:`Parte de ${p}`,resp:p,done:false,start:todayISO(),doneAt:''}];added.push(p)}});
  return added.length?added:false;
}
const pendSubs=t=>(t.subs||[]).filter(s=>!s.done);
// Quién tiene la tarea ahora: en etapas de terceros, el indicado; con Marketing, quienes tienen subtareas pendientes (o los responsables)
function enManos(t){
  if(t.col==='terminado')return '';
  if(stageOf(stageKey(t)).ext)return t.manos||'';
  const ps=uniq(pendSubs(t).map(s=>s.resp));
  return (ps.length?ps:t.resp||[]).join(', ');
}
const subsCell=t=>{const ss=t.subs||[],n=ss.filter(s=>s.done).length;return ss.length?`<span class="${n===ss.length?'':'muted'}">${n}/${ss.length}</span>`:'<span class="muted">–</span>'};
// Quien creó la tarea (por usuario en la versión publicada, por nombre en la local)
const isCreator=t=>!!((UID&&t.createdBy===UID)||(t.createdByName&&t.createdByName===ui.me));
// Devuelve por qué la persona de "Yo soy" no puede llevar la tarea a ese lugar, o '' si puede.
function canEnter(t,col,etapa){
  const me=ui.me,coord=CFG.coord||'',isCoord=!coord||me===coord||isAdmin();
  const isResp=(t.resp||[]).includes(me)||(t.subs||[]).some(s=>s.resp===me),isCre=isCreator(t);
  if(!isCoord&&!isResp&&!isCre)return `Solo quien creó la tarea, sus responsables o el coordinador (${coord}) pueden moverla.`;
  // Cerrar una tarea es de quienes intervienen en ella: quien la creó y sus responsables (y el administrador)
  if(col==='terminado'&&!isResp&&!isCre&&!isAdmin())return 'Solo quien creó la tarea o sus responsables pueden cerrarla.';
  const pend=pendSubs(t);
  const falta=`Faltan subtareas: ${pend.map(s=>(s.resp?s.resp+' – ':'')+s.t).join(', ')}.`;
  if(((col==='proceso'&&etapa==='cotizacion')||col==='produccion')&&!isCoord)return `Solo el coordinador (${coord}) puede enviar a ${col==='produccion'?'producción':'cotización'}.`;
  if(col==='produccion'&&pend.length)return 'El material aún no está listo. '+falta;
  if(col==='revision'&&etapa==='vb'&&pend.length)return falta;
  if(col==='terminado'&&etapa==='cancelado'&&!isCoord)return `Solo el coordinador (${coord}) puede cancelar una tarea.`;
  if(col==='terminado'&&etapa!=='cancelado'&&pend.length)return falta;
  return '';
}

// Registra un cambio de columna, variante, "en manos de" o motivo, con su fecha y quién lo hizo.
function applyChange(id,{col,etapa,manos,motivo,date,time}){
  const t=TASKS.get(id);if(!t)return false;
  const I=info(t),d=date||todayISO(),h=time||nowHM();
  etapa=VARIANTES[col]?(etapa||defEtapa(col)):'';
  manos=usesManos(col,etapa)?matchName(manos,manosList()):'';
  motivo=col==='terminado'&&etapa==='cancelado'?(motivo||'').trim():'';
  if(t.col===col&&(t.etapa||'')===etapa&&(t.manos||'')===manos&&(t.motivo||'')===motivo){toast('No hay cambios que registrar');return false}
  if(!(t.col===col&&(t.etapa||'')===etapa)){const why=canEnter(t,col,etapa);if(why){toast(why);return false}}
  if(I.cur&&tsOf(d,h)<tsOf(I.cur.start,I.cur.startTime)){toast('La fecha y hora no pueden ser anteriores al inicio de la etapa actual ('+fdh(I.cur.start,I.cur.startTime)+')');return false}
  t.moves=[...(t.moves||[]),{col,etapa,manos,motivo,date:d,time:h,by:UID,byName:ui.me}];
  t.col=col;t.etapa=etapa;t.manos=manos;t.motivo=motivo;
  persist(id);
  toast(`${t.num||'Tarea'}: ${placeName(t)}${manos?' ('+manos+')':''}`);
  return true;
}

function rangeWin(k,from,to){
  const t=todayISO();

const LCOLS=[['num','Nº','asc'],['title','Tarea','asc'],['empresa','Empresa','asc'],['etapa','Estado','asc'],['manos','En manos de','asc'],['resp','Responsables','asc'],['ingreso','Ingreso','asc'],['dias','En etapa','desc'],['entrega','Entrega','asc']];
function sortVal(t,k){const I=info(t);return k==='num'?parseInt((t.num||'').slice(1),10)||0:k==='title'?t.title.toLowerCase():k==='empresa'?t.empresa||'':k==='etapa'?STAGES.findIndex(s=>s.id===stageKey(t)):k==='manos'?(enManos(t)||'~'):k==='resp'?(t.resp||[]).join(','):k==='ingreso'?I.start:k==='dias'?(I.isDone?-1:I.days):t.entrega||'9999'}
function stageDotCls(t){if(t.col==='terminado')return t.etapa==='cancelado'?'x':'d';const s=stageOf(stageKey(t));return s.ext?'e':t.col==='recibido'?'r':'m'}
function stageCell(t){return `<span class="stage"><span class="dot ${stageDotCls(t)}"></span>${esc(placeName(t))}</span>`}
function listView(){
  const ts=[...TASKS.values()].filter(t=>visible(t)&&!(ui.hideDone&&t.col==='terminado')).sort((a,b)=>{const x=sortVal(a,ui.sortK),y=sortVal(b,ui.sortK);const r=typeof x==='number'?x-y:String(x).localeCompare(String(y),'es');return (ui.sortDir==='asc'?r:-r)||byNum(a,b)});

  ${ts.map(t=>{const I=info(t);return `<tr class="click" data-open="${esc(t.id)}" tabindex="0">
    <td class="muted">${esc(t.num||'')}</td>
    <td><b>${esc(t.title)}</b>${(t.subs||[]).length?` <span class="muted" style="font-size:13px">${t.subs.filter(s=>s.done).length}/${t.subs.length} subtareas</span>`:''}</td>
    <td>${t.empresa?empLabel(t.empresa):''}</td>
    <td>${stageCell(t)}</td>
    <td>${esc(enManos(t))}</td>
    <td><span class="avs">${(t.resp||[]).map(av).join('')}</span></td>
    <td style="white-space:nowrap">${fd(I.start)} <span class="muted" style="font-size:13px">hace ${dias(dd(I.start,today))}</span></td>

  </tbody></table></div>`;
}

/* ---------- Resumen ---------- */
// Tres pestañas: General, Por empresa y Por persona.
// El período filtra horas, tiempos y terminadas; "abiertas", "estancadas" y "esperando ahora" son siempre el estado actual.
// Las tareas canceladas no entran en promedios ni en "terminadas".
const R_TABS=[['general','General'],['empresa','Por empresa'],['persona','Por persona']];
const R_RANGES=[['todo','Todo'],['mes','Este mes'],['semana','Esta semana'],['custom','Personalizado']];
const stageDot=s=>`<span class="dot ${s.ext?'e':s.id==='recibido'?'r':'m'}"></span>`;
const sumHs=hs=>hs.reduce((a,h)=>a+(+h.h||0),0);
const kpi=(num,lbl,hint,color)=>`<div class="kpi"><span class="num" ${color?`style="color:var(${color})"`:''}>${num}</span><span class="lbl">${lbl}</span>${hint?`<span class="hint">${hint}</span>`:''}</div>`;
const tbl=(heads,rows)=>`<div class="scroll"><table class="t"><thead><tr>${heads.map(h=>Array.isArray(h)?`<th class="n">${h[0]}</th>`:`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const sec=(title,intro,content,empty)=>`<div class="sec"><h2>${title}</h2>${intro?`<p class="intro">${intro}</p>`:''}${content||`<p class="muted">${empty}</p>`}</div>`;
const empCell=e=>e==='Sin empresa'?'<span class="muted">Sin empresa</span>':empLabel(e);
const perCell=p=>p==='Sin asignar'?'<span class="muted">Sin asignar</span>':`<span style="white-space:nowrap">${av(p)} ${esc(p)}</span>`;
function resumenView(){
  const [a,b]=rangeWin(ui.rRange,ui.rFrom,ui.rTo),todo=a==='0000-01-01'&&b==='9999-12-31';
  const A=a==='0000-01-01'?-Infinity:tsOf(a,'00:00'),B=b==='9999-12-31'?Infinity:tsOf(addDays(b,1),'00:00');
  const inR=d=>!!d&&d>=a&&d<=b;
  // Por tarea: tiempos recortados al período, horas registradas en el período y si terminó en el período
  const X=[...TASKS.values()].map(t=>{const I=info(t);let hm=0,he=0;
    I.stays.forEach(s=>{if(s.done)return;const h=Math.max(0,Math.min(s.t1,B)-Math.max(s.t0,A))/36e5;if(s.ext)he+=h;else hm+=h});
    return {t,I,hm,he,hs:(t.horas||[]).filter(h=>inR(h.d)),doneIn:I.isDone&&!I.cancelled&&inR(I.end),cancIn:I.cancelled&&inR(I.end)}});
  const per=todo?'desde el inicio':ui.rRange==='mes'?'este mes':ui.rRange==='semana'?'esta semana':`del ${fd(a)} al ${fd(b)}`;
  const ctx={X,inR,per};
  const head=`<div class="rhead"><div class="fgroup" role="tablist">${R_TABS.map(([v,l])=>`<button class="fchip ${ui.rTab===v?'on':''}" data-act="rtab" data-v="${v}" role="tab" aria-selected="${ui.rTab===v}">${l}</button>`).join('')}</div>
    <div class="fgroup"><span class="lab">Período</span>${R_RANGES.map(([v,l])=>`<button class="fchip sm ${ui.rRange===v?'on':''}" data-act="rrange" data-v="${v}">${l}</button>`).join('')}
    ${ui.rRange==='custom'?`<span class="fgroup" style="font-size:13px">desde <input type="date" id="rFrom" value="${esc(ui.rFrom)}" aria-label="Desde"> hasta <input type="date" id="rTo" value="${esc(ui.rTo)}" aria-label="Hasta"></span>`:''}</div></div>`;
  return `<div class="wrap">${head}${ui.rTab==='empresa'?resEmpresa(ctx):ui.rTab==='persona'?resPersona(ctx):resGeneral(ctx)}</div>`;
}
// Fila de tarea abierta, compartida por las pestañas
function openRows(xs,showEmp){
  const heads=['Nº','Tarea',...(showEmp?['Empresa']:[]),'Estado','En manos de','Responsables',['Subtareas'],['En esta etapa']];
  return tbl(heads,xs.sort((x,y)=>byNum(x.t,y.t)).map(({t,I})=>`<tr class="click" data-open="${esc(t.id)}" tabindex="0"><td class="muted">${esc(t.num||'')}</td><td><b>${esc(t.title)}</b></td>${showEmp?`<td>${t.empresa?empLabel(t.empresa):''}</td>`:''}<td>${stageCell(t)}</td><td>${esc(enManos(t))}</td><td><span class="avs">${(t.resp||[]).map(av).join('')}</span></td><td class="n">${subsCell(t)}</td><td class="n" style="white-space:nowrap"><b style="${I.days>=STALE?'color:var(--ext-text)':''}">${dur(I.cur?I.cur.hrs:0)}</b></td></tr>`));

// Tabla por tipo: tareas con actividad, horas y tiempos en el período
function tipoRows(xs){
  const act=xs.filter(x=>!x.I.cancelled&&(!x.I.isDone||x.doneIn||x.hs.length||x.hm+x.he>0));
  const tps=uniq(act.map(x=>x.t.tipo||'Sin tipo'));
  if(!tps.length)return '';
  return tbl(['Tipo',['Abiertas'],['Terminadas'],['Horas de Marketing'],['Tiempo con Marketing'],['Tiempo esperando a terceros']],tps.map(tp=>{const ys=act.filter(x=>(x.t.tipo||'Sin tipo')===tp);

function resGeneral({X,inR,per}){
  const open=X.filter(x=>!x.I.isDone),ext=open.filter(x=>x.I.ext).length;
  const done=X.filter(x=>x.doneIn).length,canc=X.filter(x=>x.cancIn).length,h=X.reduce((s,x)=>s+sumHs(x.hs),0);
  const stale=open.filter(x=>x.I.days>=STALE).sort((p,q)=>q.I.days-p.I.days);
  const closed=[];X.forEach(x=>{if(!x.I.cancelled)x.I.stays.forEach(s=>{if(s.end&&!s.done&&inR(s.end))closed.push(s)})});
  const byStage=STAGES.filter(s=>!s.done).map(st=>{const ds=closed.filter(s=>s.key===st.id).map(s=>s.hrs);return {st,n:ds.length,avg:avg(ds),max:ds.length?Math.max(...ds):0}});
  const byManos=uniq(closed.filter(s=>s.ext&&s.manos).map(s=>s.manos)).map(m=>{const ss=closed.filter(s=>s.manos===m);return {m,n:ss.length,avg:avg(ss.map(s=>s.hrs)),now:open.filter(x=>x.t.manos===m).length}}).sort((p,q)=>q.avg-p.avg);

  const hechas=X.filter(x=>!x.I.cancelled).flatMap(x=>(x.t.subs||[]).filter(s=>s.done&&inR(s.doneAt)).map(s=>({s,p:s.resp||'Sin asignar',x})));
  const subPpl=[...CFG.people.filter(p=>pend.some(y=>y.p===p)||hechas.some(y=>y.p===p)),...uniq([...pend,...hechas].map(y=>y.p)).filter(p=>!CFG.people.includes(p))];
  const byTipo=uniq(fin.map(x=>x.t.tipo||'Sin tipo')).map(tp=>{const is=fin.filter(x=>(x.t.tipo||'Sin tipo')===tp).map(x=>x.I);return {tp,n:is.length,tot:avg(is.map(i=>i.totalH)),m:avg(is.map(i=>i.hm)),e:avg(is.map(i=>i.he)),r:avg(is.map(i=>i.revs))}}).sort((p,q)=>q.n-p.n);
  return `<div class="cards4">
    ${kpi(open.length,plural(open.length,'Tarea abierta','Tareas abiertas'),'Ahora')}

    ${kpi(ext,'Esperando a terceros','Cotización, producción o revisión','--ext-text')}
    ${kpi(done,'Terminadas',`Entregadas, publicadas o recepcionadas ${per}${canc?`. Además ${canc} ${plural(canc,'cancelada','canceladas')}`:''}`,'--done')}
    ${kpi(hrs(h),'Horas de Marketing',`Registradas ${per}`)}
    ${kpi(pend.length,plural(pend.length,'Subtarea pendiente','Subtareas pendientes'),`Ahora. ${hechas.length} ${plural(hechas.length,'completada','completadas')} ${per}`)}
  </div>
  ${sec('Subtareas por persona',`Lo que tiene pendiente cada uno en tareas abiertas, y lo que completó ${per}. Haz clic en una persona para ver su detalle.`,subPpl.length?tbl(['Persona',['Pendientes'],['En tareas'],['La más antigua'],['Completadas']],subPpl.map(p=>{const ps=pend.filter(y=>y.p===p),old=ps.length?Math.max(...ps.map(y=>dd(y.s.start||todayISO(),todayISO()))):0;
    return `<tr class="click" data-act="rPer" data-v="${esc(p)}" tabindex="0"><td>${perCell(p)}</td><td class="n"><b>${ps.length||'–'}</b></td><td class="n">${new Set(ps.map(y=>y.x.t.id)).size||'–'}</td><td class="n" style="${old>=STALE?'color:var(--ext-text)':''}">${ps.length?dias(Math.max(0,old)):'–'}</td><td class="n">${hechas.filter(y=>y.p===p).length||'–'}</td></tr>`})):'','No hay subtareas pendientes ni completadas en el período.')}
  ${sec('Estancadas',`Tareas abiertas con ${STALE} días o más en la misma etapa.`,stale.length?`<div class="scroll"><table class="t"><tbody>${stale.map(({t,I})=>`<tr class="click" data-open="${esc(t.id)}" tabindex="0"><td class="muted">${esc(t.num||'')}</td><td><b>${esc(t.title)}</b></td><td>${t.empresa?empLabel(t.empresa):''}</td><td>${stageCell(t)}</td><td>${esc(enManos(t))}</td><td class="n">${subsCell(t)}</td><td class="n"><b style="color:var(--ext-text)">${dias(I.days)}</b></td></tr>`).join('')}</tbody></table></div>`:'','Ninguna. Todas las tareas abiertas han cambiado de etapa en la última semana.')}
  <div class="cols2">

  </div>
  ${sec('Por tipo de tarea',`Tareas terminadas ${per}: cuánto toma cada tipo de trabajo de principio a fin y cuántas veces pasa por revisión.`,byTipo.length?tbl(['Tipo',['Terminadas'],['Tiempo total'],['Con Marketing'],['Esperando a terceros'],['Revisiones']],byTipo.map(x=>`<tr><td><b>${esc(x.tp)}</b></td><td class="n">${x.n}</td><td class="n"><b>${dur(x.tot)}</b></td><td class="n" style="color:var(--mkt)">${dur(x.m)}</td><td class="n" style="color:var(--ext-text)">${dur(x.e)}</td><td class="n">${r1(x.r)}</td></tr>`)):'',`No hay tareas terminadas ${per}.`)}`;
}
function resEmpresa({X,per}){

    return pick+sec('Todas las empresas',note+` Período: ${per}. Haz clic en una empresa para ver su detalle.`,emps.length?tbl(['Empresa',['Abiertas'],['Terminadas'],['Horas de Marketing'],['Tiempo con Marketing'],['Tiempo esperando a terceros'],['Esperando ahora']],rows):'','Aún no hay tareas.');

  const xs=of(sel),ok=xs.filter(x=>!x.I.cancelled),open=xs.filter(x=>!x.I.isDone),hs=xs.flatMap(x=>x.hs.map(h=>({...h,id:x.t.id})));
  const hm=ok.reduce((s,x)=>s+x.hm,0),he=ok.reduce((s,x)=>s+x.he,0);
  const ppl=[...CFG.people.filter(p=>hs.some(h=>h.p===p)),...uniq(hs.map(h=>h.p||'Sin asignar')).filter(p=>!CFG.people.includes(p))];

    ${kpi(dur(hm),'Tiempo con Marketing',per,'--mkt')}
    ${kpi(dur(he),'Tiempo esperando a terceros',`Aprobaciones, cotizaciones, proveedores (${per})`,'--ext-text')}
  </div>
  ${sec('Tareas abiertas','Estado actual. Haz clic en una tarea para abrir su ficha.',open.length?openRows(open,false):'','No tiene tareas abiertas.')}
  <div class="cols2">
  ${sec('Horas por persona',`Registradas ${per}.`,ppl.length?tbl(['Persona',['Horas'],['Tareas']],[...ppl.map(p=>{const mine=hs.filter(h=>(h.p||'Sin asignar')===p);return `<tr><td>${perCell(p)}</td><td class="n"><b>${hrs(sumHs(mine))}</b></td><td class="n">${new Set(mine.map(h=>h.id)).size}</td></tr>`}),`<tr><td><b>Total</b></td><td class="n"><b>${hrs(sumHs(hs))}</b></td><td class="n">${new Set(hs.map(h=>h.id)).size}</td></tr>`]):'',`Nadie registró horas ${per}.`)}
  </div>
  ${sec('Por tipo de tarea',`Tareas con actividad ${per}.`,tipoRows(xs),`Sin actividad ${per}.`)}

}
function resPersona({X,inR,per}){
  const hs=X.flatMap(x=>x.hs.map(h=>({...h,p:h.p||'Sin asignar',e:x.t.empresa||'Sin empresa',tipo:x.t.tipo||'Sin tipo',x})));
  const ppl=[...CFG.people,...uniq(hs.map(h=>h.p)).filter(p=>!CFG.people.includes(p))];
  const sel=ppl.includes(ui.rPer)?ui.rPer:'';
  const pick=`<div class="fgroup pick"><span class="lab">Persona</span><button class="fchip sm ${sel?'':'on'}" data-act="rPer" data-v="">Todas</button>${ppl.map(p=>`<button class="fchip sm ${sel===p?'on':''}" data-act="rPer" data-v="${esc(p)}">${p==='Sin asignar'?'Sin asignar':av(p)+esc(p)}</button>`).join('')}</div>`;
  const openOf=p=>X.filter(x=>!x.I.isDone&&involves(x.t,p));
  if(!sel){
    const emps=uniq(hs.map(h=>h.e));
    const rows=ppl.map(p=>{const mine=hs.filter(h=>h.p===p);
      return `<tr class="click" data-act="rPer" data-v="${esc(p)}" tabindex="0"><td>${perCell(p)}</td><td class="n">${openOf(p).length}</td>${emps.map(e=>{const ys=mine.filter(h=>h.e===e),n=new Set(ys.map(h=>h.x.t.id)).size;return `<td class="n">${n?`${hrs(sumHs(ys))} <span class="muted" style="font-size:13px">(${n})</span>`:'<span class="muted">–</span>'}</td>`}).join('')}<td class="n"><b>${hrs(sumHs(mine))}</b></td></tr>`});
    rows.push(`<tr><td><b>Total</b></td><td></td>${emps.map(e=>`<td class="n"><b>${hrs(sumHs(hs.filter(h=>h.e===e)))}</b></td>`).join('')}<td class="n"><b>${hrs(sumHs(hs))}</b></td></tr>`);
    return pick+sec('Horas por persona y empresa',`Horas de Marketing registradas ${per} por cada persona, según la empresa de la tarea. Entre paréntesis, en cuántas tareas registró horas. "Tareas abiertas" es el estado actual. Haz clic en una persona para ver su detalle.`,
      ppl.length?tbl(['Persona',['Tareas abiertas'],...emps.map(e=>[empCell(e)]),['Total']],rows):'','Agrega personas en Ajustes.');
  }
  const mine=hs.filter(h=>h.p===sel),open=openOf(sel);
  const subs=[];open.forEach(x=>(x.t.subs||[]).forEach(s=>{if(!s.done&&s.resp===sel)subs.push({x,s})}));
  const fin=X.filter(x=>x.doneIn&&involves(x.t,sel));
  const hechas=[];X.forEach(x=>{if(!x.I.cancelled)(x.t.subs||[]).forEach(s=>{if(s.done&&s.resp===sel&&inR(s.doneAt))hechas.push({x,s})})});
  const group=(k,cell)=>{const ks=uniq(mine.map(h=>h[k]));return ks.length?tbl([k==='e'?'Empresa':'Tipo',['Horas'],['Tareas']],ks.map(v=>{const ys=mine.filter(h=>h[k]===v);return `<tr><td>${cell(v)}</td><td class="n"><b>${hrs(sumHs(ys))}</b></td><td class="n">${new Set(ys.map(h=>h.x.t.id)).size}</td></tr>`})):''};
  const regs=mine.slice().sort((p,q)=>(q.d||'').localeCompare(p.d||'')).slice(0,20);
  return pick+`<div class="cards4">
    ${kpi(open.length,plural(open.length,'Tarea abierta','Tareas abiertas'),'Donde es responsable o tiene subtareas')}
    ${kpi(subs.length,plural(subs.length,'Subtarea pendiente','Subtareas pendientes'),'A su nombre, ahora')}
    ${kpi(hechas.length,plural(hechas.length,'Subtarea completada','Subtareas completadas'),per,'--done')}
    ${kpi(hrs(sumHs(mine)),'Horas de Marketing',`Registradas ${per}`)}
    ${kpi(fin.length,'Terminadas',`Tareas en que participó, ${per}`,'--done')}
  </div>
  ${sec('Tareas abiertas','Estado actual. Haz clic en una tarea para abrir su ficha.',open.length?openRows(open,true):'','No tiene tareas abiertas.')}
  ${sec('Subtareas pendientes','Lo que falta de su parte para que las tareas avancen.',subs.length?tbl(['Nº','Tarea','Subtarea',['Desde hace']],subs.map(({x,s})=>`<tr class="click" data-open="${esc(x.t.id)}" tabindex="0"><td class="muted">${esc(x.t.num||'')}</td><td>${esc(x.t.title)}</td><td><b>${esc(s.t)}</b></td><td class="n">${dias(Math.max(0,dd(s.start||todayISO(),todayISO())))}</td></tr>`)):'','No tiene subtareas pendientes.')}
  ${sec('Subtareas completadas',`Lo que terminó de su parte ${per}.`,hechas.length?tbl(['Nº','Tarea','Subtarea','Completada'],hechas.sort((p,q)=>q.s.doneAt.localeCompare(p.s.doneAt)).map(({x,s})=>`<tr class="click" data-open="${esc(x.t.id)}" tabindex="0"><td class="muted">${esc(x.t.num||'')}</td><td>${esc(x.t.title)}</td><td><b>${esc(s.t)}</b></td><td>${fd(s.doneAt)}</td></tr>`)):'',`No completó subtareas ${per}.`)}
  <div class="cols2">
  ${sec('Horas por empresa',`Registradas ${per}.`,group('e',empCell),`No registró horas ${per}.`)}
  ${sec('Horas por tipo de tarea',`Registradas ${per}.`,group('tipo',v=>esc(v)),`No registró horas ${per}.`)}
  </div>
  ${sec('Registros de horas',`Los últimos registros ${per}.`,regs.length?tbl(['Fecha','Tarea','Empresa',['Horas'],'Qué se hizo'],regs.map(h=>`<tr class="click" data-open="${esc(h.x.t.id)}" tabindex="0"><td>${fd(h.d)}</td><td>${esc((h.x.t.num?h.x.t.num+' ':'')+h.x.t.title)}</td><td>${empCell(h.e)}</td><td class="n"><b>${hrs(+h.h||0)}</b></td><td class="muted">${esc(h.n||'')}</td></tr>`)):'',`No registró horas ${per}.`)}
  ${sec('Terminadas',`Tareas terminadas ${per} en que participó.`,fin.length?doneRows(fin,true):'',`No hay tareas terminadas ${per}.`)}`;
}

/* ================= Ventana de cambio de etapa ================= */
// Se abre al pasar una tarea a En proceso, En revisión, En producción o Terminado, o al hacer clic en su etiqueta.
function stageForm(id,col){
  const t=TASKS.get(id);if(!t||RO)return;
  const I=info(t),same=t.col===col,min=I.cur?I.cur.start:'';
  const title={proceso:same?'Cambiar etapa dentro de En proceso':'Pasa a En proceso',revision:same?'Cambiar tipo de revisión o en manos de quién':'Pasa a En revisión',produccion:same?'Cambiar en manos de quién está':'Pasa a En producción',terminado:same?'Cambiar cómo terminó':'Pasa a Terminado'}[col];
  const manosField=`<div class="f"><label for="sfManos">¿En manos de quién? <span style="text-transform:none;letter-spacing:0;font-weight:500">(opcional)</span></label>
      <input id="sfManos" name="manos" list="dlManos" value="${esc(same?t.manos||'':'')}" placeholder="${col==='revision'?'Quién autoriza o revisa. Ej.: Gerencia comercial, CAU, cliente':'Proveedor. Ej.: Imprenta Chillán'}">
      <datalist id="dlManos">${manosList().map(m=>`<option value="${esc(m)}">`).join('')}</datalist>
      <span class="hint">Escribe el nombre o elige uno usado antes.</span></div>`;
  let body='';
  if(col==='proceso')body=`<div class="f"><span class="lb">¿En qué etapa está?</span><div class="opts" role="radiogroup">
      ${ETAPAS.map(e=>{const cur=same&&t.etapa===e.id,why=cur?'':canEnter(t,'proceso',e.id);
        return `<label class="opt ${why?'dis':''}"><input type="radio" name="etapa" value="${e.id}" ${cur?'checked':''} ${why?'disabled':''} required><span class="dot ${e.ext?'e':'m'}"></span><span class="lbl">${esc(e.name)}${why?`<span class="why">${esc(why)}</span>`:''}</span><span class="who2" style="${e.ext?'color:var(--ext-text)':'color:var(--muted)'}">${e.ext?'espera al proveedor':'con Marketing'}</span></label>`}).join('')}
    </div></div>${manosField}`;
  else if(col==='revision')body=`<div class="f"><span class="lb">¿Qué se está revisando?</span><div class="opts" role="radiogroup">
      ${REVISIONES.map(e=>{const cur=same&&t.etapa===e.id,why=cur?'':canEnter(t,'revision',e.id);
        return `<label class="opt ${why?'dis':''}"><input type="radio" name="etapa" value="${e.id}" ${cur?'checked':''} ${why?'disabled':''} required><span class="dot e"></span><span class="lbl">${esc(e.name)}${why?`<span class="why">${esc(why)}</span>`:''}</span></label>`}).join('')}
    </div></div>${manosField}`;
  else if(col==='produccion')body=manosField;
  else body=`<div class="f"><span class="lb">¿Cómo terminó?</span><div class="opts" role="radiogroup">
      ${FINALES.map(e=>{const cur=same&&t.etapa===e.id,why=cur?'':canEnter(t,'terminado',e.id);
        return `<label class="opt ${why?'dis':''}"><input type="radio" name="etapa" value="${e.id}" ${cur?'checked':''} ${why?'disabled':''} required><span class="dot ${e.cancel?'x':'d'}"></span><span class="lbl">${esc(e.name)}${why?`<span class="why">${esc(why)}</span>`:''}</span></label>`}).join('')}
    </div></div>
    <div class="f"><label for="sfMot">Motivo <span style="text-transform:none;letter-spacing:0;font-weight:500">(opcional)</span></label><input id="sfMot" name="motivo" value="${esc(same?t.motivo||'':'')}" placeholder="Ej.: el cliente desistió, sin presupuesto"></div>`;
  dlg.className='mid';ui.openId=null;
  dlg.innerHTML=`<form class="dlg" id="sf" autocomplete="off">
    <h3>${esc(t.num||'')} ${esc(t.title)}</h3><p class="sub-h">${title}</p>
    ${body}
    <div class="f"><label for="sfDesc">Descripción</label><textarea id="sfDesc" name="desc" rows="3" placeholder="Qué pasó, detalles, links, contactos…">${esc(t.desc||'')}</textarea></div>
    <div class="grid" style="max-width:360px"><div class="f"><label for="sfDate">Fecha del cambio</label><input id="sfDate" name="date" type="date" value="${todayISO()}" min="${min}" required></div>
      <div class="f"><label for="sfTime">Hora</label><input id="sfTime" name="time" type="time" value="${nowHM()}" required></div></div>
    <div class="dact"><button type="button" class="btn" data-act="full" data-id="${esc(t.id)}" style="margin-right:auto">Ver ficha completa</button><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri" type="submit">${same?'Guardar':'Mover'}</button></div>
  </form>`;
  dlg.showModal();
  const f=$('#sf');
  // "En manos de" solo aplica a etapas de terceros; "motivo" solo a canceladas
  const sync=()=>{const v=(f.querySelector('[name=etapa]:checked')||{}).value;
    const m=$('#sfManos');if(m&&col==='proceso'){const off=!v||v==='mkt';m.disabled=off;if(off)m.value=''}
    const rv=col==='revision'&&REVISIONES.find(e=>e.id===v);if(m&&rv&&rv.manos&&!m.value)m.value=rv.manos;
    const mo=$('#sfMot');if(mo){const off=v!=='cancelado';mo.disabled=off;mo.closest('.f').hidden=off}};
  f.addEventListener('change',e=>{if(e.target.name==='etapa'){sync();const m=$('#sfManos');if(m&&!m.disabled)m.focus();const mo=$('#sfMot');if(mo&&!mo.disabled)mo.focus()}});sync();
  const first=f.querySelector('[name=etapa]:checked')||f.querySelector('[name=etapa]:not(:disabled)')||$('#sfManos');if(first)first.focus();
  // La descripción se guarda aunque el cambio de etapa no proceda
  f.onsubmit=e=>{e.preventDefault();const fdt=new FormData(f),ch={col,etapa:fdt.get('etapa')||'',manos:fdt.get('manos')||'',motivo:fdt.get('motivo')||'',date:fdt.get('date'),time:fdt.get('time')};
    const descChanged=saveDesc(t,fdt.get('desc'));
    if(descChanged&&same&&(ch.etapa||'')===(t.etapa||'')&&ch.manos.trim()===(t.manos||'')&&ch.motivo.trim()===(t.motivo||'')){closeDlg();toast('Descripción guardada');return}
    if(applyChange(id,ch))closeDlg()};
}
function saveDesc(t,v){v=v==null?(t.desc||''):String(v);if(v===(t.desc||''))return false;t.desc=v;persist(t.id);return true}
// Mover a una columna: Recibido es directo; las demás preguntan
// Si no hay ninguna opción permitida en esa columna, avisa y abre la ficha para resolver lo pendiente.
function moveTo(id,col){
  const t=TASKS.get(id);if(!t)return;
  if(col==='recibido'){applyChange(id,{col,date:todayISO(),time:nowHM()});return}
  if(t.col!==col){
    const opts=VARIANTES[col]?VARIANTES[col].map(e=>e.id):[''];
    const whys=opts.map(o=>canEnter(t,col,o));
    if(whys.every(Boolean)){toast(whys[0]);openTask(id);return}
  }
  stageForm(id,col);
}

    case 'clear':ui.mine=false;ui.emp='';ui.resp='';ui.q='';renderAll();break;
    case 'order':ui.order=ui.order==='asc'?'desc':'asc';renderAll();break;
    case 'rtab':ui.rTab=a.dataset.v;renderAll();break;

        const keep=t.moves.slice(),order=keep.map((m,i)=>({m,i})).sort((x,y)=>mKey(x.m).localeCompare(mKey(y.m))||x.i-y.i),last=order.pop();keep.splice(last.i,1);
        const prev=normStep(order[order.length-1].m);t.moves=keep;t.col=prev.col;t.etapa=prev.etapa||'';t.manos=prev.manos||'';t.motivo=prev.motivo||'';
        persist(t.id);openTask(t.id,true);toast('Último cambio deshecho')}break;

  const id=dragId,to=col.dataset.col,t=TASKS.get(id);col.classList.remove('over');dragId=null;if(!t||t.col===to)return;moveTo(id,to)});

/* ================= Supabase (versión publicada) ================= */
// Si config.js trae la dirección y la clave pública del proyecto, el tablero usa Supabase:
// ingreso con correo y contraseña, datos compartidos y cambios en vivo. Cada persona entra con su nombre (tabla perfiles)
// y la base solo deja modificar las tareas donde participa, salvo al administrador.
const SB_LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js';
let SB=null,ME=null;
const isAdmin=()=>!!(ME&&ME.admin);
// Observador (clientes internos): ve el tablero y la lista, sin editar ni ver horas internas
const isObs=()=>!!(ME&&ME.observador);
const canEdit=t=>!ME||ME.admin||involves(t,ME.nombre)||isCreator(t);
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
// Misma forma que la base de claude.ai, para no cambiar el resto del código
function sbAdapter(){
  const tb=c=>c==='tasks'?'tareas':'config',chk=({error})=>{if(error)throw error};
  return {doc:path=>{const [c,id]=path.split('/');return {
      set:body=>SB.from(tb(c)).upsert({id,data:body}).then(chk),
      delete:()=>SB.from(tb(c)).delete().eq('id',id).then(chk)}},
    collection:()=>({doc:()=>({id:crypto.randomUUID()})})};
}
async function sbLoad(){
  const [c,t]=await Promise.all([SB.from('config').select('data').eq('id','main').maybeSingle(),SB.from('tareas').select('id,data')]);
  if(c.error||t.error)throw c.error||t.error;
  CFG=normCfg(c.data?c.data.data:null);
  TASKS=new Map(t.data.map(r=>[r.id,{...normTask(clone(r.data)),id:r.id}]));
}
// Vuelve a leer todo (son pocas tareas) cuando alguien cambia algo o cuando la base rechaza un cambio
let sbT=null;
function sbReload(){clearTimeout(sbT);sbT=setTimeout(async()=>{
  try{await sbLoad();renderAll();if(ui.openId&&dlg.open&&dlg.className==='side'&&!dlg.contains(document.activeElement))openTask(ui.openId,true)}
  catch(e){MODE='caido';renderAll()}},400)}
// Los usuarios sin correo (observadores) existen en Supabase como usuario@observador.cromatico.cl
const loginEmail=v=>{v=v.trim().toLowerCase();return v.includes('@')?v:v.replace(/\s+/g,'')+'@observador.cromatico.cl'};
function loginView(msg){
  $('#content').innerHTML=`<form class="login" id="lf"><h2>Ingresar</h2><p class="muted" style="margin:0">Usa el correo (o el usuario) y la contraseña que te entregó el administrador.</p>
    <div class="f"><label for="lfE">Correo o usuario</label><input id="lfE" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="f"><label for="lfP">Contraseña</label><input id="lfP" type="password" autocomplete="current-password" required></div>
    ${msg?`<p class="err">${esc(msg)}</p>`:''}
    <button class="btn pri" type="submit">Entrar</button></form>`;
  $('#lfE').focus();
  $('#lf').onsubmit=async e=>{e.preventDefault();e.target.querySelector('button').disabled=true;
    const {error}=await SB.auth.signInWithPassword({email:loginEmail($('#lfE').value),password:$('#lfP').value});
    if(error){const c=error.code||'';loginView(c==='email_not_confirmed'?'Este correo aún no está confirmado. En Supabase, el usuario debe crearse con "Auto Confirm User".'
      :c==='invalid_credentials'?'Usuario o contraseña incorrectos.':'No se pudo ingresar: '+(error.message||c));return}
    sbStart()};
}
async function sbStart(){
  const {data:{session}}=await SB.auth.getSession();
  if(!session){MODE='login';renderAll();loginView();return}
  const {data:p,error}=await SB.from('perfiles').select('*').eq('id',session.user.id).maybeSingle();
  if(error||!p){const em=session.user.email;await SB.auth.signOut();MODE='login';renderAll();
    loginView(error?'No se pudo leer tu perfil: '+(error.message||error.code):`La contraseña es correcta, pero ${em} todavía no tiene perfil en el tablero. Pide al administrador que lo agregue.`);return}
  ME=p;UID=p.id;DB=sbAdapter();MODE='db';if(p.observador)RO=true;
  try{await sbLoad()}catch(e){MODE='caido';renderAll();return}
  renderAll();
  SB.channel('cambios')
    .on('postgres_changes',{event:'*',schema:'public',table:'tareas'},sbReload)
    .on('postgres_changes',{event:'*',schema:'public',table:'config'},sbReload)
    .subscribe();
}

/* ================= Inicio ================= */
renderAll();
(async function(){
  const S=window.RUTA_SUPABASE;
  if(S&&S.url&&S.key){try{await loadScript(SB_LIB);SB=supabase.createClient(S.url,S.key);await sbStart()}catch(e){MODE='caido';renderAll()}return}
  const c=window.claude;
  let db=null,user=null;
  if(c&&typeof c.use==='function'){[db,user]=await Promise.all([c.use('db'),c.use('user')])}
  USER=user;
  if(user){UID=await user.id();const w=await user.can('data.write');if(w===false)RO=true}
  if(!db){MODE='local';loadLocal();renderAll();return}
  DB=db;MODE='db';
  let gotCfg=false,gotTasks=false;
  const ready=()=>{if(gotCfg&&gotTasks){renderAll();if(ui.openId&&dlg.open&&dlg.className==='side'&&!dlg.contains(document.activeElement))openTask(ui.openId,true)}};
  const fail=()=>{MODE='caido';renderAll()};
  db.doc('config/main').onSnapshot(s=>{if(s.exists)CFG=normCfg(clone(s.data()));gotCfg=true;ready()},fail);
  db.collection('tasks').onSnapshot(s=>{TASKS=new Map(s.docs.map(d=>[d.id,{...normTask(clone(d.data())),id:d.id}]));gotTasks=true;ready()},fail);
})();
</script>
